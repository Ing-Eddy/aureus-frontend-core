name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Storybook stories run as browser tests (Vitest + Playwright): install Chromium first.
      - run: pnpm --filter @aureus-core/storybook exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      # Verifies the ui package output: every component compiled and typed, no leaked aliases,
      # publint/attw clean, and only build output in the tarball.
      - run: pnpm check:package
