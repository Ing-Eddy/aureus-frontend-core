schema: spec-driven

context: |
  Monorepo of shared frontend resources published to public npm under @aureus-core.
  Stack: pnpm workspaces (apps/*, packages/*, tooling/*), Turborepo, Biome (single root config),
  React 19, TypeScript (strict, shared configs in tooling/typescript), Tailwind CSS v4,
  shadcn/ui (radix-nova style, Radix primitives), tsdown (unbundled ESM + d.ts), Vitest + Testing Library,
  Storybook (react-vite, apps/storybook), Changesets + GitHub Actions with npm trusted publishing.
  Consumers: Vite + React SPAs.
  Conventions:
  - packages/ui/src/shadcn/** and src/styles/shadcn.css are owned by the shadcn CLI: never edit them by hand.
  - Customise shadcn in this order: tokens in src/styles/theme.css -> wrap in src/components/ -> fork into src/components/ under a new name.
  - src/shadcn never imports from src/components.
  - Pure kebab-case file names; role suffixes use "-": <name>-types.ts, <name>-tests.tsx, <name>-stories.tsx.
  - One folder per custom component with an index.ts barrel; no root barrel.
  - Public imports: @aureus-core/ui/shadcn/<name>, /components/<name>, /hooks/<name>, /lib/utils, /styles.css.
  - Stories live in apps/storybook/src/stories/{shadcn,components}/.
  - Every change to a published package needs a changeset.

